[build-system]
requires = ["uv_build>=0.11.32,<0.13"]
build-backend = "uv_build"

[project]
name = "securecode-ai-adapters"
version = "1.2.8"
description = "Infrastructure adapters for SecureCode AI Core ports"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "pydantic>=2.12,<3",
    "securecode-ai-contracts==1.2.8",
    "securecode-ai-core==1.2.8",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-go==0.25.0",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-python>=0.25,<0.26",
    "tree-sitter-typescript==0.23.2",
]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[tool.uv.sources]
securecode-ai-contracts = { workspace = true }
securecode-ai-core = { workspace = true }

[tool.uv.build-backend]
module-name = "securecode_ai.adapters"
