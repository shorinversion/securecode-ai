[build-system]
requires = ["uv_build>=0.11.32,<0.13"]
build-backend = "uv_build"

[project]
name = "securecode-ai-adapters"
version = "0.1.0a0"
description = "Infrastructure adapters for SecureCode AI Core ports"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = ["securecode-ai-core==0.1.0a0"]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[tool.uv.sources]
securecode-ai-core = { workspace = true }

[tool.uv.build-backend]
module-name = "securecode_ai.adapters"
