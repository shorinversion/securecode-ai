[build-system]
requires = ["uv_build>=0.11.32,<0.13"]
build-backend = "uv_build"

[project]
name = "securecode-ai-core"
version = "1.2.2"
description = "Framework-independent domain core for SecureCode AI"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = ["securecode-ai-contracts==1.2.2"]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[tool.uv.sources]
securecode-ai-contracts = { workspace = true }

[tool.uv.build-backend]
module-name = "securecode_ai.core"
