[project]
name = "securecode-ai-workspace"
version = "0.1.0a0"
description = "Reproducible workspace authority for SecureCode AI"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "securecode-ai-adapters==0.1.0a0",
    "securecode-ai-contracts==0.1.0a0",
    "securecode-ai-core==0.1.0a0",
]
classifiers = ["Private :: Do Not Upload"]

[tool.uv]
package = false
required-version = "==0.12.0"
default-groups = []
exclude-newer = "2026-08-13T00:00:00Z"
build-constraint-dependencies = ["uv_build>=0.11.32,<0.13"]

[dependency-groups]
build = ["uv-build>=0.11.32,<0.13"]

[tool.uv.sources]
securecode-ai-adapters = { workspace = true }
securecode-ai-contracts = { workspace = true }
securecode-ai-core = { workspace = true }

[tool.uv.workspace]
members = [
    "packages/adapters",
    "packages/contracts",
    "packages/core",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
