[project]
name = "securecode-ai-workspace"
version = "1.0.0rc1"
description = "Reproducible workspace authority for SecureCode AI"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "securecode-ai-adapters==1.0.0rc1",
    "securecode-ai-cli==1.0.0rc1",
    "securecode-ai-contracts==1.0.0rc1",
    "securecode-ai-core==1.0.0rc1",
    "securecode-ai-server==1.0.0rc1",
    "securecode-ai-worker==1.0.0rc1",
]
classifiers = ["Private :: Do Not Upload"]

[tool.uv]
package = false
required-version = "==0.12.0"
default-groups = []
exclude-newer = "2026-08-13T00:00:00Z"
build-constraint-dependencies = ["uv_build>=0.11.32,<0.13"]

[dependency-groups]
build = ["uv-build>=0.11.32,<0.13"]
quality = [
    "detect-secrets==1.5.0",
    "jsonschema==4.26.0",
    "mypy==2.3.0",
    "pip-audit==2.10.1",
    "pre-commit==4.6.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pyyaml==6.0.3",
    "rfc3339-validator==0.1.4",
    "rfc3987-syntax==1.1.0",
    "ruff==0.15.22",
    "uv==0.12.0",
    "zizmor==1.28.0",
]

[tool.uv.sources]
securecode-ai-adapters = { workspace = true }
securecode-ai-cli = { workspace = true }
securecode-ai-contracts = { workspace = true }
securecode-ai-core = { workspace = true }
securecode-ai-server = { workspace = true }
securecode-ai-worker = { workspace = true }

[tool.uv.workspace]
members = [
    "apps/cli",
    "apps/server",
    "apps/worker",
    "packages/adapters",
    "packages/contracts",
    "packages/core",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.ruff]
required-version = "==0.15.22"
target-version = "py312"
line-length = 100
extend-exclude = ["scripts/validate_g0.py"]

[tool.ruff.lint]
select = ["B", "C4", "DTZ", "E4", "E7", "E9", "F", "I", "PTH", "RUF", "SIM", "UP"]

[tool.ruff.format]
preview = false

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true
mypy_path = [
    "apps/cli/src",
    "apps/server/src",
    "apps/worker/src",
    "packages/adapters/src",
    "packages/contracts/src",
    "packages/core/src",
]
exclude = ["scripts/validate_g0.py"]

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests/unit"]
pythonpath = ["."]
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib", "-ra"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = [
    "securecode_ai.core",
]

[tool.coverage.report]
fail_under = 80
precision = 2
show_missing = true
skip_empty = true
