services:
  securecode-server:
    environment:
      SECURECODE_BACKUP_ENCRYPTION_EXECUTABLE: /run/securecode/backup-encryption
      SECURECODE_BACKUP_ENCRYPTION_EXECUTABLE_SHA256: ${SECURECODE_BACKUP_ENCRYPTION_EXECUTABLE_SHA256:?Set the approved backup encryption adapter SHA256}
      SECURECODE_BACKUP_ENCRYPTION_TIMEOUT_SECONDS: ${SECURECODE_BACKUP_ENCRYPTION_TIMEOUT_SECONDS:-30}
    volumes:
      - type: bind
        source: ${SECURECODE_BACKUP_ENCRYPTION_SOURCE:?Set the approved backup encryption adapter path}
        target: /run/securecode/backup-encryption
        read_only: true
        bind:
          create_host_path: false
  securecode-maintenance:
    environment:
      SECURECODE_BACKUP_ENCRYPTION_EXECUTABLE: /run/securecode/backup-encryption
      SECURECODE_BACKUP_ENCRYPTION_EXECUTABLE_SHA256: ${SECURECODE_BACKUP_ENCRYPTION_EXECUTABLE_SHA256:?Set the approved backup encryption adapter SHA256}
      SECURECODE_BACKUP_ENCRYPTION_TIMEOUT_SECONDS: ${SECURECODE_BACKUP_ENCRYPTION_TIMEOUT_SECONDS:-30}
    volumes:
      - type: bind
        source: ${SECURECODE_BACKUP_ENCRYPTION_SOURCE:?Set the approved backup encryption adapter path}
        target: /run/securecode/backup-encryption
        read_only: true
        bind:
          create_host_path: false
