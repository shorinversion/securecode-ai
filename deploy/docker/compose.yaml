services:
  securecode-server:
    build:
      context: ../..
      dockerfile: deploy/docker/server.Dockerfile
    image: securecode-ai/server:local
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:${SECURECODE_SERVER_PUBLISHED_PORT:-8443}:8080"
    environment:
      SECURECODE_SERVER_HOST: 0.0.0.0
      SECURECODE_SERVER_PORT: "8080"
      SECURECODE_DATA_DIR: /var/lib/securecode
      SECURECODE_TMP_DIR: /tmp/securecode
      SECURECODE_DATA_REGION: ${SECURECODE_DATA_REGION:-}
      SECURECODE_TENANT_RESIDENCY_REGIONS: ${SECURECODE_TENANT_RESIDENCY_REGIONS:-}
      SECURECODE_TLS_CERT_FILE: /run/secrets/securecode_tls_cert
      SECURECODE_TLS_KEY_FILE: /run/secrets/securecode_tls_key
      SECURECODE_BOOTSTRAP_TENANT_ID: ${SECURECODE_BOOTSTRAP_TENANT_ID:?Set a tenant ID}
      SECURECODE_BOOTSTRAP_ADMIN_TOKEN_FILE: /run/secrets/securecode_admin_token
      SECURECODE_BOOTSTRAP_WORKER_TOKEN_FILE: /run/secrets/securecode_worker_token
      SECURECODE_BOOTSTRAP_WORKER_REPOSITORIES: ${SECURECODE_BOOTSTRAP_WORKER_REPOSITORIES:?Set allowed repository IDs}
      SECURECODE_ARTIFACT_UPLOAD_URL: https://securecode-server:8080/api/v1/artifact-uploads
    secrets:
      - securecode_tls_cert
      - securecode_tls_key
      - securecode_admin_token
      - securecode_worker_token
    volumes:
      - server-data:/var/lib/securecode
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3
    networks: [securecode-private, securecode-egress]

  securecode-worker:
    build:
      context: ../..
      dockerfile: deploy/docker/worker.Dockerfile
    image: securecode-ai/worker:local
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      securecode-server:
        condition: service_healthy
    environment:
      SECURECODE_CONTROL_PLANE_URL: https://securecode-server:8080
      SECURECODE_WORKER_ID: ${SECURECODE_WORKER_ID:-compose-worker-1}
      SECURECODE_WORKER_TARGET: /workspace/repository
      SECURECODE_WORKER_TOKEN_FILE: /run/secrets/securecode_worker_token
      SECURECODE_WORKER_ARTIFACT_HOSTS: securecode-server
      SECURECODE_WORKER_LOCAL_PROVIDER_PORT: ${SECURECODE_WORKER_LOCAL_PROVIDER_PORT:-11435}
      SECURECODE_WORKER_LOCAL_PROVIDER_WAIT_SECONDS: ${SECURECODE_WORKER_LOCAL_PROVIDER_WAIT_SECONDS:-300}
      SECURECODE_DATA_DIR: /var/lib/securecode
      SECURECODE_TMP_DIR: /tmp/securecode
      SSL_CERT_FILE: /run/secrets/securecode_tls_ca
    secrets:
      - securecode_worker_token
      - securecode_tls_ca
    volumes:
      - type: bind
        source: ${SECURECODE_WORKER_SOURCE:?Set an absolute path to the checkout}
        target: /workspace/repository
        read_only: true
      - type: bind
        source: ${SECURECODE_WORKER_APPROVAL_ANCHOR_SOURCE:?Set the root-owned local approval anchor path}
        target: /etc/securecode-ai/approval-anchor.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SECURECODE_OLLAMA_BINARY_SOURCE:?Set the approved Ollama executable path}
        target: /run/securecode/ollama
        read_only: true
        bind:
          create_host_path: false
      - worker-data:/var/lib/securecode
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g,mode=1777
    pids_limit: 256
    mem_limit: 4g
    cpus: 4
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "python", "/app/worker_healthcheck.py"]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3
    networks: [securecode-private]

  securecode-ollama:
    image: ${SECURECODE_OLLAMA_IMAGE:?Set a pinned Ollama image digest}
    network_mode: service:securecode-worker
    depends_on:
      securecode-worker:
        condition: service_started
    entrypoint: ["/usr/bin/ollama"]
    command: ["serve"]
    user: "65532:65532"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    gpus: all
    environment:
      HOME: /tmp
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_MODELS: /models
    volumes:
      - type: bind
        source: ${SECURECODE_OLLAMA_BINARY_SOURCE:?Set the approved Ollama executable path}
        target: /usr/bin/ollama
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SECURECODE_OLLAMA_MODELS_SOURCE:?Set the preloaded local model store}
        target: /models
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    pids_limit: 64
    mem_limit: 16g
    cpus: 8
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6

  securecode-maintenance:
    image: securecode-ai/server:local
    entrypoint: ["python"]
    command: ["-m", "securecode_ai.server.maintenance_daemon"]
    init: true
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: none
    depends_on:
      securecode-server:
        condition: service_healthy
    environment:
      SECURECODE_DATA_DIR: /var/lib/securecode
      SECURECODE_TMP_DIR: /tmp/securecode
      SECURECODE_MAINTENANCE_TENANT_ID: ${SECURECODE_MAINTENANCE_TENANT_ID:?Set a tenant ID}
      SECURECODE_MAINTENANCE_OWNER_ID: ${SECURECODE_MAINTENANCE_OWNER_ID:?Set an executor identity}
      SECURECODE_RETENTION_METADATA_DAYS: ${SECURECODE_RETENTION_METADATA_DAYS:?Set metadata retention}
      SECURECODE_RETENTION_ARTIFACT_DAYS: ${SECURECODE_RETENTION_ARTIFACT_DAYS:?Set artifact retention}
      SECURECODE_RETENTION_AUDIT_DAYS: ${SECURECODE_RETENTION_AUDIT_DAYS:?Set audit retention}
      SECURECODE_RETENTION_PLAN_LIMIT: ${SECURECODE_RETENTION_PLAN_LIMIT:-32}
      SECURECODE_RETENTION_EXECUTE_LIMIT: ${SECURECODE_RETENTION_EXECUTE_LIMIT:-32}
      SECURECODE_MAINTENANCE_INTERVAL_SECONDS: ${SECURECODE_MAINTENANCE_INTERVAL_SECONDS:-60}
    volumes:
      - server-data:/var/lib/securecode
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    pids_limit: 32
    mem_limit: 512m
    cpus: 1
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      disable: true

secrets:
  securecode_tls_cert:
    file: ${SECURECODE_TLS_CERT_SOURCE:?Set the TLS certificate path}
  securecode_tls_key:
    file: ${SECURECODE_TLS_KEY_SOURCE:?Set the TLS private key path}
  securecode_tls_ca:
    file: ${SECURECODE_TLS_CA_SOURCE:?Set the CA certificate path}
  securecode_admin_token:
    file: ${SECURECODE_ADMIN_TOKEN_SOURCE:?Set the admin token file path}
  securecode_worker_token:
    file: ${SECURECODE_WORKER_TOKEN_SOURCE:?Set the worker token file path}

volumes:
  server-data:
  worker-data:

networks:
  securecode-private:
    driver: bridge
    internal: true
  securecode-egress:
    driver: bridge
