schema_version: "0.1-draft"

task:
  id: "P2.13"
  type: "implementation"
  objective: "Expose a bounded deterministic facts-and-report diagnostic mode through the CLI without claiming a product scan PASS before the mandatory model-native lane exists."
  baseline_id: "securecode-definition-0.2.0"
  baseline_content_sha256: "dedb43be8b\
    a055dfa478\
    58b975630b\
    4c870af3be\
    d2dda842b0\
    e8422c8354\
    b5c9"
  baseline_commit_sha: "f5cd4ef2a0\
    f7130d16cb\
    2c20609190\
    8be71b0702"
  starting_commit_sha: "805fa17528\
    2357cc4df1\
    148c026ca3\
    6af327d807"
  spec_refs: [SC-PROD-008, SC-PROD-014, SC-PROD-018, SC-PROD-019, SC-CLI-001, SC-CLI-002, SC-CLI-003, SC-CLI-005, SC-CLI-008, SC-CLI-009, SC-REPORT-003, SC-REPORT-004, SC-REPORT-005, SC-REPORT-008, SC-REPORT-011]
  decision_refs: [D-027]
  preconditions:
    - "P2.12 deterministic report renderer is integrated in the gate candidate"
  non_goals:
    - "product scan outcome, policy verdict derivation, model-native discovery, Auditor/Skeptic interpretation, repository intake, scanner implementation, configuration resolution, or source mutation"
    - "new public contracts or schemas; accepted CLI wire contracts remain immutable"

execution:
  primary_integrator: "codex-root"
  owner_role: "cli-diagnostic-implementer"
  mode: "integrated-gate-candidate"
  exclusive_path_lease:
    - "apps/cli/src/securecode_ai/cli/application.py"
    - "apps/cli/src/securecode_ai/cli/diagnostic.py"
    - "apps/cli/src/securecode_ai/cli/__init__.py"
    - "tests/unit/test_cli_diagnostic.py"
    - "work/task-packets/P2.13.yaml"
  may_delegate_further: false
  integration_owner: "codex-root"

scope:
  allowed_paths:
    - "apps/cli/src/securecode_ai/cli/application.py"
    - "apps/cli/src/securecode_ai/cli/diagnostic.py"
    - "apps/cli/src/securecode_ai/cli/__init__.py"
    - "tests/unit/test_cli_diagnostic.py"
    - "work/task-packets/P2.13.yaml"
  forbidden_paths: ["specs/**", "scripts/**", ".github/**", "artifacts/gates/**", "packages/contracts/**", "packages/core/**", "packages/adapters/**", "pyproject.toml", "uv.lock", "docs/**"]
  max_changed_files: 5
  max_diff_lines: 1800

constraints:
  invariants:
    - "only `securecode scan PATH --diagnostic` admits this mode; `scan` without the explicit marker remains unavailable"
    - "completion receipt has a versioned single machine JSON object and always declares diagnostic scope, product_outcome=NOT_EVALUATED, scan_readiness=NOT_EVALUATED and model_native_discovery=NOT_EXECUTED"
    - "a successful diagnostic means only deterministic facts/report rendering completed; it never encodes product PASS"
    - "the CLI uses P2.12 render_report over an already validated DeterministicReport and never implements scanners, verdicts, a second Core, model access, network or source mutation"
    - "format selection is explicit; output creation is opt-in and uses exclusive creation so an existing destination is never overwritten"
    - "machine stdout has one JSON result only; human diagnostics and all errors are fixed safe text without source, secret, terminal-control or absolute-path echo"  # pragma: allowlist secret

verification:
  acceptance_commands:
    - "deferred: one canonical G2 full test and quality cycle after P2.6-P2.13 integration"
  positive_cases:
    - "explicit diagnostic composition renders P2.12 JSON, Markdown, HTML and SARIF report bytes from the same validated report"
    - "machine receipt is one line and explicitly records non-product scope/readiness/outcome"
  negative_cases:
    - "ordinary scan without --diagnostic remains invalid/unavailable"
    - "unwired facts composer is indeterminate and cannot echo target/source"
    - "existing output is preserved and yields a typed safe operational error"
  independent_validator_required: false
  primary_integrator_rerun_required: true

completion:
  definition_of_done_refs: [P2.13]
  gate_contribution: "Supplies a deterministic diagnostic/report CLI seam toward G2; it does not establish product scan PASS or complete G2."
  changelog_required: true
  adr_required: false
