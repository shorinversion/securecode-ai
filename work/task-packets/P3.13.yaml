  decision_refs: [D-024, D-027, D-044]
  preconditions:
    - "G2 Deterministic Core Ready is effective GO."
    - "P3.10 receipt contract and P3.12 bounded local connector are present in the integrated G3 candidate."
  non_goals:
    - "model execution, provider profile/schema amendment, connector transport changes, hardware sufficiency claims, source/model text retention, product PASS, or G3 completion"

execution:
  primary_integrator: "codex-root"
  owner_role: "local-model-qualification-implementer"
  mode: "isolated-checkpoint"
  exclusive_path_lease:
    - "packages/adapters/src/securecode_ai/adapters/local_model_qualification.py"
    - "tests/integration/test_local_model_qualification.py"
    - "work/task-packets/P3.13.yaml"
  may_delegate_further: false
  integration_owner: "codex-root"

scope:
  allowed_paths:
    - "packages/adapters/src/securecode_ai/adapters/local_model_qualification.py"
    - "tests/integration/test_local_model_qualification.py"
    - "work/task-packets/P3.13.yaml"
  forbidden_paths: ["specs/**", "scripts/**", ".github/**", "artifacts/gates/**", "packages/contracts/**", "packages/adapters/src/securecode_ai/adapters/__init__.py", "docs/**", "CHANGELOG.md", "pyproject.toml", "uv.lock"]
  max_changed_files: 3
  max_diff_lines: 1400

constraints:
  invariants:
    - "The input pins exact model tag, immutable manifest hash, size/format/architecture/quantization, explicit parameter-size label, SPDX identifier, license-text hash/source identifier and restriction labels."
    - "Runtime identity/version/hash and P3.12 local connector type are explicit; generic input does not claim a live invocation."
    - "CPU, RAM and each GPU memory observation retain a source/uncertainty label; unreliable platform adapter memory is never converted into a VRAM sufficiency claim."
    - "The zero-monetary-cost field is exact and any nonzero value is rejected."
    - "The qualified structured request is model-native discovery and contains no scanner evidence; the RepositoryView request is typed and pinned to the same HEAD and expected repository-scope hash."
    - "Real evidence binds exact request/receipt hashes and expected repository scope for successful nonempty discovery, completed-zero, provider fault and tool fault; missing evidence is INDETERMINATE and no state implies product PASS."
    - "Nested request/evidence/record values are reconstructed or Pydantic-revalidated before semantic checks and hashing; object-level tampering produces a fixed typed error."
    - "Nested validation errors are non-echoing: their fixed qualification error has no cause/context chain and retains no untrusted validation detail."
    - "The retained source-free record visibly preserves validated artifact/runtime/hardware/pin/scope/zero-cost fields and has deterministic canonical bytes and hash."
    - "No model/source/prompt/provider response text, credential or secret is retained by the contract."

verification:
  acceptance_commands:
    - "deferred: one canonical whole-G3 quality cycle after all G3 tasks integrate"
  positive_cases:
    - "Generic pinned local model input records a bounded structured request, one RepositoryView request and an INDETERMINATE pending qualification."
    - "Exact P3.10 success, completed-zero, provider-fault and tool-fault receipts can be recorded without a product outcome."
  negative_cases:
    - "Model/HEAD/scope/cost drift, unavailable-memory claim, provider fault mismatch and tool-receipt hash mismatch are rejected without transport or model execution."
  independent_validator_required: false
  primary_integrator_rerun_required: true
  local_checks_skipped_by_assignment: "Do not run tests, lint, type, quality, review, push, PR or CI. Mandatory commit hooks only."

completion:
  definition_of_done_refs: [P3.13]
  gate_contribution: "Supplies fail-closed qualification scaffolding for the real local academic-demo evidence collected during G3 closing; it does not establish G3 or product PASS."
  changelog_required: false
  adr_required: false
