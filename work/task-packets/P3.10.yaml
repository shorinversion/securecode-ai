  spec_refs: [SC-SYS-001, SC-SYS-004, SC-SYS-007, SC-PORT-003, SC-PORT-004, SC-CAP-001, SC-CAP-004, SC-CAP-008, SC-CAP-009, SC-CAP-010, SC-MODEL-003, SC-MODEL-005, SC-WF-017, SC-WF-022, SC-WF-023, SC-DOM-002, SC-DOM-011, SC-DOM-012]
  decision_refs: [D-027]
  preconditions:
    - "G2 Deterministic Core Ready is effective GO."
    - "P3.1/P3.2 and P3.7 contracts are present in the integrated G3 candidate."
  non_goals:
    - "provider transport, credential access, egress authorization, filesystem repository implementation, schema amendments, workflow routing, Auditor interpretation, or product PASS"

execution:
  primary_integrator: "codex-root"
  owner_role: "model-native-discovery-implementer"
  mode: "isolated-checkpoint"
  exclusive_path_lease:
    - "packages/core/src/securecode_ai/core/model_discovery.py"
    - "tests/unit/test_model_discovery.py"
    - "work/task-packets/P3.10.yaml"
  may_delegate_further: false
  integration_owner: "codex-root"

scope:
  allowed_paths:
    - "packages/core/src/securecode_ai/core/model_discovery.py"
    - "tests/unit/test_model_discovery.py"
    - "work/task-packets/P3.10.yaml"
  forbidden_paths: ["specs/**", "scripts/**", ".github/**", "artifacts/gates/**", "packages/contracts/**", "packages/adapters/**", "packages/core/src/securecode_ai/core/__init__.py", "docs/**", "pyproject.toml", "uv.lock"]
  max_changed_files: 3
  max_diff_lines: 1200

constraints:
  invariants:
    - "every eligible supported-scope scan invokes the model-native backend even when deterministic scanners produced zero signals"
    - "only the P3.7 RepositoryToolGuard exposes list_paths, lookup_symbol, read_range and read_evidence; repository output remains instruction_authority=NONE"
    - "request, tenant, repository, HEAD, model/profile/prompt and repository scope remain exact immutable identities"
    - "ineligible preflight performs zero repository-context and backend/provider operations and produces an INDETERMINATE-required typed receipt with no deterministic-only fallback"
    - "completed-zero is only SUCCEEDED plus schema-valid receipt and empty candidate IDs; provider, payload, tool and budget non-successes cannot become completed-zero or PASS"
    - "model-native candidates carry only typed MODEL_NATIVE lineage; all evidence references stay inside the approved scope"

verification:
  acceptance_commands:
    - "deferred: one canonical whole-G3 quality cycle after all G3 tasks integrate"
  positive_cases:
    - "zero deterministic scanner signals still permit a model-native candidate with immutable MODEL_NATIVE lineage"
    - "a successful empty model-native response creates an explicit completed-zero receipt"
  negative_cases:
    - "ineligible profile performs zero repository/backend calls"
    - "out-of-scope or exhausted RepositoryView tools, provider exception and inconsistent provider usage return typed INDETERMINATE-required results without candidates"
  independent_validator_required: false
  primary_integrator_rerun_required: true
  local_checks_skipped_by_assignment: "Do not run tests, lint, type, quality, review, push, PR or CI. Mandatory commit hooks only."

completion:
  definition_of_done_refs: [P3.10]
  gate_contribution: "Supplies the mandatory model-native discovery lane for G3; it does not establish G3 or product PASS."
  changelog_required: true
  adr_required: false
