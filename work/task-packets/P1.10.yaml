schema_version: "0.2-draft"

task:
  id: "P1.10"
  type: "implementation"
  objective: "Create the installable SecureCode CLI foundation with a closed versioned machine-result contract, stable exit codes, safe configuration diagnostics, and a no-network doctor command without implementing analysis or outcome authority."
  baseline_id: "securecode-definition-0.2.0"
  baseline_content_sha256: "dedb43be8ba055dfa47858b975630b4c870af3bed2dda842b0e8422c8354b5c9"
  baseline_commit_sha: "f5cd4ef2a0f7130d16cb2c206091908be71b0702"
  starting_commit_sha: "9efbac41ea9548318b0a4b312dbe24b341d4ce2a"
  spec_refs: [SC-DOM-001, SC-DOM-005, SC-DOM-007, SC-DOM-008, SC-SYS-002, SC-PROD-009, SC-PROD-010, SC-CLI-001, SC-CLI-002, SC-CLI-003, SC-CLI-006, SC-CLI-009]
  decision_refs: [D-007, D-015, D-017, D-026, D-027]
  preconditions:
    - "G0 strict validator exits 0 against frozen baseline 0.2.0"
    - "P1.2 packaging, P1.5 domain contracts, P1.7 configuration, P1.8 model boundary, and P1.9 LocalWorkflowRuntime are committed with clean completion evidence"
    - "repository worktree is clean at starting_commit_sha except this reviewed packet"
  non_goals:
    - "repository intake, scanners, agents, model calls, EvidenceGraph, findings, patches, validation, reports, or AuditRunOutcome derivation"
    - "functional scan/fix/validate commands; P2.13 owns deterministic diagnostic scan mode and P4.11 owns the full scan/fix/validate UX"
    - "apply authorization/state belongs to P4.9 and its final CLI composition belongs to P4.11"
    - "connected ci transport/control-plane behavior; P5.1 owns worker-mode exit integration and P6.6 owns the connected protocol"
    - "file-output creation, overwrite/apply semantics, SARIF/Markdown/HTML formatting, or SC-CLI-004/005/007/008 completion"
    - "full source-bearing provider/capability/egress preflight; doctor checks only configuration/profile/selected-egress compatibility and leaves SC-CLI-009 product-scan completion downstream"
    - "repository/user configuration file discovery; P1.10 composes the already accepted resolver with injected closed layers and uses safe defaults plus environment for the installed foundation command"
    - "a second Core, workflow, policy engine, or CLI-owned security verdict"

