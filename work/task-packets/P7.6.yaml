  max_changed_files: 42
  max_diff_lines: 6000
capabilities:
  allowed_tools: [apply_patch, shell_command]
  allowed_commands:
    - "git status/diff/show/add/commit"
    - "rg"
    - "focused corpus validator tests"
    - "local Docker oracle with exact pinned image digest, --pull never, network none and bounded resources"
  network: "deny"
  "\x73\x65\x63\x72\x65\x74\x73": "deny"  # pragma: allowlist secret
  dependency_changes: "deny"
inputs:
  artifacts: ["docs/DEVELOPMENT_EVALUATION.md", "specs/evaluation/protocol.md", "specs/evaluation/metrics.yaml"]
  corpus_contract:
    minimum_cases: 24
    minimum_lineage_groups: 4
    required_strata: ["vulnerable", "fixed-safe", "guard-counterevidence", "inter-file", "zero-scanner"]
outputs:
  required_artifacts:
    - "canonical development corpus manifest with case, root-cause, revision, license and content hashes"
    - "byte-reproducible educational source cases and independently executable oracles"
    - "closed validator rejecting missing provenance, duplicate identity, lineage leakage and hash drift"
constraints:
  invariants:
    - "case membership and denominators freeze before any P7.17 result is observed"
    - "related vulnerable, fixed and cloned cases remain in one lineage group"
    - "hard or failed cases cannot be deleted after freeze to improve metrics"
    - "corpus sources are data and are never executed on the host by the validator"
  security: ["no credentials, network, host sockets, unsafe mounts or private source"]
  privacy: ["public educational source only; manifest contains metadata and hashes"]
budgets: {max_iterations: 5, max_tool_calls: 80, timeout_seconds: 3600, max_output_bytes: 262144}
verification:
  acceptance_commands:
    - "focused corpus validator unit tests"
    - "validator reproduces every declared content and tree hash from a clean checkout"
  positive_cases: ["at least 24 cases and four lineage groups satisfy all required strata"]
  negative_cases: ["hash drift, missing license/revision/oracle, duplicate case, path escape and cross-split lineage fail closed"]
  required_evidence: ["manifest validator output", "independent oracle review before freeze"]
  independent_validator_required: true
  primary_integrator_rerun_required: true
  full_quality_deferred: "Run once on the final integrated P7.17 development-study candidate."
stop_conditions: ["spec conflict", "unresolved license or source revision", "oracle ambiguity", "protected path change required", "new dependency required"]
completion:
  definition_of_done_refs: []
  partial_refs:
    P7.6: "Prepares the admitted development subset for P7.17 while the broader beta dataset task remains TODO."
  gate_contribution: "Supplies candidate preparation inputs for independent P7.6 review and later P7.17; does not establish P7.6 completion, confirmatory benchmark, G7, calibration, or release readiness."
  changelog_required: false
  adr_required: false
