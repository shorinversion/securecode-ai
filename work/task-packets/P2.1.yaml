schema_version: "0.1-draft"

task:
  id: "P2.1"
  type: "implementation"
  objective: "Implement deterministic, no-execution local repository intake and a bounded immutable file inventory that rejects traversal, links/reparse points, nested repository/submodule boundaries, special files, identity races and resource bombs without exposing absolute host paths."
  baseline_id: "securecode-definition-0.2.0"
  baseline_content_sha256: "\x64\x65\x64\x62\x34\x33\x62\x65\x38\x62\x61\x30\x35\x35\x64\x66\x61\x34\x37\x38\x35\x38\x62\x39\x37\x35\x36\x33\x30\x62\x34\x63\x38\x37\x30\x61\x66\x33\x62\x65\x64\x32\x64\x64\x61\x38\x34\x32\x62\x30\x65\x38\x34\x32\x32\x63\x38\x33\x35\x34\x62\x35\x63\x39"
  baseline_commit_sha: "\x66\x35\x63\x64\x34\x65\x66\x32\x61\x30\x66\x37\x31\x33\x30\x64\x31\x36\x63\x62\x32\x63\x32\x30\x36\x30\x39\x31\x39\x30\x38\x62\x65\x37\x31\x62\x30\x37\x30\x32"
  starting_commit_sha: "\x36\x32\x32\x61\x61\x32\x36\x30\x30\x63\x35\x33\x35\x35\x62\x64\x35\x66\x36\x33\x62\x35\x63\x65\x63\x36\x34\x63\x30\x65\x61\x36\x61\x63\x30\x30\x37\x32\x30\x31"
  spec_refs: [SC-PROD-003, SC-DOM-005, SC-DOM-006, SC-SYS-001, SC-SYS-004, SC-SBX-005]
  decision_refs: [D-015, D-027]
  preconditions:
    - "G1 decision is effective GO and exact master push run 32483085630 is green"
    - "snapshot spec gate and CI policy pass at starting_commit_sha"
    - "worktree is clean at starting_commit_sha except this task candidate"
  non_goals:
    - "ignore rules, language/dependency discovery, parsing, symbols, scanners, findings, reports, model calls or workflow integration"
    - "archive extraction, Git checkout/ref resolution, remote clone/fetch, submodule initialization or lifecycle command execution"
    - "hostile-kernel or coordinated memory-corruption resistance beyond checked filesystem identities and fail-closed adapter boundaries"

execution:
  primary_integrator: "codex-root"
  owner_role: "repository-intake-implementer"
  mode: "direct"
  parent_task_id: null
  exclusive_path_lease:
    - "CHANGELOG.md"
    - "docs/CONTEXT.md"
    - "docs/PLAN.md"
    - "packages/core/src/securecode_ai/core/__init__.py"
    - "packages/core/src/securecode_ai/core/repository.py"
    - "packages/adapters/src/securecode_ai/adapters/__init__.py"
    - "packages/adapters/src/securecode_ai/adapters/repository.py"
    - "tests/unit/test_package_boundaries.py"
    - "tests/unit/test_repository_intake.py"
    - "work/task-attestations/P2.1.json"
    - "work/task-packets/P2.1.yaml"
  parallel_sibling_tasks: []
  may_delegate_further: false
  integration_owner: "codex-root"

scope:
  allowed_paths:
    - "CHANGELOG.md"
    - "docs/CONTEXT.md"
    - "docs/PLAN.md"
    - "packages/core/src/securecode_ai/core/__init__.py"
    - "packages/core/src/securecode_ai/core/repository.py"
    - "packages/adapters/src/securecode_ai/adapters/__init__.py"
    - "packages/adapters/src/securecode_ai/adapters/repository.py"
    - "tests/unit/test_package_boundaries.py"
    - "tests/unit/test_repository_intake.py"
    - "work/task-attestations/P2.1.json"
    - "work/task-packets/P2.1.yaml"
  forbidden_paths:
    - "specs/**"
    - "scripts/**"
    - ".github/**"
    - "artifacts/gates/**"
    - "packages/contracts/**"
    - "apps/**"
    - "integrations/**"
    - "deploy/**"
  max_changed_files: 11
  max_diff_lines: 3200

capabilities:
  allowed_tools: [apply_patch, shell_command, independent_review]
  allowed_commands:
    - "git status/diff/show/rev-parse/add/commit"
    - "rg"
    - "pytest targeted repository intake and package boundary suites"
    - "python scripts/quality.py"
    - "python scripts/spec_gate.py snapshot/index-candidate/committed-candidate"
    - "python scripts/ci_policy.py validate"
    - "python scripts/validate_g0.py --require-frozen"
  network: "deny except authorized GitHub publication after completed local validation"
  "\x73\x65\x63\x72\x65\x74\x73": "deny"
  dependency_changes: "deny"

outputs:
  required_artifacts:
    - "closed immutable InventoryLimits, RepositoryFile and RepositoryInventory Core values"
    - "fixed non-echo RepositoryIntakeError codes"
    - "FileSystemRepositoryIntake adapter with deterministic POSIX-style paths and content/tree SHA-256"
    - "symlink/reparse, traversal/ambiguous path, nested .git/submodule, special-file, mutation and resource-limit negatives"
    - "archive inputs are inventoried only as opaque bytes and never extracted"

constraints:
  invariants:
    - "repository bytes are read only; intake performs no import, exec, subprocess, shell, archive extraction, network or write"
    - "inventory contains repository-relative normalized POSIX paths only and never retains or renders the absolute root"
    - "every accepted file is regular, non-link, identity-stable across read and covered by per-file and cumulative limits"
    - "output ordering and tree hash are deterministic for identical bytes and limits"
  compatibility:
    - "new values are internal Core Python contracts, not public packages/contracts schema roots"
    - "no dependency or accepted specification changes"
  security:
    - "all failures use fixed context-free diagnostics and never echo path/source/OS exception text"
    - "any ambiguous entry, unsupported type, link/reparse point, nested repository marker, collision, race or limit exhaustion rejects the whole inventory"

budgets:
  max_iterations: 8
  max_tool_calls: 70
  timeout_seconds: 3600
  max_output_bytes: 260000

verification:
  acceptance_commands:
    - "targeted repository intake and package boundary tests"
    - "canonical quality command"
    - "python scripts/spec_gate.py snapshot"
    - "python scripts/ci_policy.py validate"
    - "python scripts/validate_g0.py --require-frozen"
    - "git diff --check and exact packet scope validation"
  positive_cases:
    - "same tree yields the same sorted entries and tree digest across repeated intake"
    - "empty, text, binary and archive-named regular files are inventoried as opaque bytes"
  negative_cases:
    - "root/file/directory symlink or platform reparse point"
    - "nested .git marker representing a submodule or nested repository"
    - "absolute/backslash/control/non-normalized/case-colliding path components"
    - "FIFO/socket/device and file/root identity or size mutation"
    - "depth, path-byte, directory, file-count, per-file and total-byte exhaustion"
    - "lifecycle scripts and archive payloads remain untouched"
  required_evidence:
    - "targeted positive/negative tests and capability spies"
    - "full quality, snapshot, CI policy and strict G0 PASS"
    - "independent product, architecture and security/evaluation PASS on one exact staged digest"
    - "post-commit clean verification and ordinary protected PR gate"
  independent_validator_required: true
  primary_integrator_rerun_required: true

stop_conditions:
  - "accepted specification or public contract change required"
  - "repository code execution or archive extraction required"
  - "protected path or external dependency change required"
  - "no new diagnostic signal"

completion:
  definition_of_done_refs: [P2.1]
  partial_refs:
    SC-PROD-003: "P2.1 completes bounded local repository intake only; parsing and scanners remain P2.2-P2.8"
    SC-SYS-004: "P2.1 supplies deterministic file/path/byte/depth budgets; workflow token/time/tool loop budgets remain later tasks"
  gate_contribution: "Supplies repository_intake_security, path_symlink_submodule_archive_escape, resource_context_bomb_budgets and lifecycle_script_sentinel evidence toward G2; does not complete G2."
  changelog_required: true
  adr_required: false
