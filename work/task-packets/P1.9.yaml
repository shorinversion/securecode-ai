    - "packages/contracts/src/securecode_ai/contracts/schemas/v0.2.0/workflow-runtime-request.schema.json"
    - "packages/contracts/src/securecode_ai/contracts/schemas/v0.2.0/workflow-runtime-result.schema.json"
