schema_version: "0.2-draft"

task:
  id: "P1.9"
  type: "implementation"
  objective: "Implement public versioned workflow contracts, a definition-bound graph-independent state machine, the WorkflowRuntime port, and a process-local LocalRuntime with deterministic replay, bounded loops, semantic idempotency, and a reusable adapter conformance suite."
  baseline_id: "securecode-definition-0.2.0"
  baseline_content_sha256: "dedb43be8ba055dfa47858b975630b4c870af3bed2dda842b0e8422c8354b5c9"
  baseline_commit_sha: "f5cd4ef2a0f7130d16cb2c206091908be71b0702"
  starting_commit_sha: "0fbf40ed1b575ce57434cddea6049576451821f3"
  spec_refs: [SC-DOM-005, SC-DOM-007, SC-DOM-008, SC-DOM-014, SC-SYS-001, SC-SYS-003, SC-SYS-004, SC-SYS-007, SC-PORT-001, SC-PORT-002, SC-PORT-003, SC-RUNTIME-001, SC-WF-001, SC-WF-002, SC-WF-003, SC-WF-004, SC-WF-005, SC-WF-010, SC-WF-022]
  decision_refs: [D-003, D-013, D-020, D-026, D-027]
  preconditions:
    - "G0 strict validator exits 0 against frozen baseline 0.2.0"
    - "P1.5 contracts, P1.6 event stream, and P1.8 provider boundary are committed with clean completion evidence"
    - "repository worktree is clean at starting_commit_sha except this reviewed packet"
  non_goals:
    - "TemporalRuntime, durable persistence, process-kill recovery, restart-surviving signals, and full SC-RUNTIME-001 completion; P6.3 owns those"
    - "LangGraph or any graph/runtime SDK dependency; any later experiment remains behind WorkflowRuntime"
    - "changes to public AuditEvent/EventType/event schema; WorkflowTransitionEvent is the sole P1.9 state-replay event and AuditEvent remains a non-authoritative causal audit projection"
    - "AuditRunOutcome, PASS/FAIL/INDETERMINATE derivation, or caller-supplied security outcome; P3.5 owns SC-WF-016/017 and consumes the trusted COVERAGE_GUARD wait handoff"
    - "candidate union, EvidenceGraph construction, and provenance semantics owned by P2/P3 under SC-WF-023"
    - "RepositoryView, scanners, model agents, repair, validation, publication, or external side effects"
    - "provider retry execution; P1.9 supplies only the definition-bound loop accounting/routing substrate"
    - "CLI/backend/worker transports, database/RunRepository, artifact storage, or telemetry sinks"

