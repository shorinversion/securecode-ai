    - "git diff --check and exact packet scope validation"
    - "committed candidate spec gate and ordinary protected PR gate"
  positive_cases:
    - "all new local links resolve and the current schedule is internally consistent"
    - "P2.5 is IN PROGRESS with protected implementation evidence"
  negative_cases:
    - "no accepted spec, evaluator, gate evidence, product code or dependency change"
    - "no claim that CR-045 automation is effective before its protected amendment"
  required_evidence:
    - "prior independent CR-046 document reviews"
    - "current-state rebind diff/link consistency check"
    - "ordinary protected PR and green post-merge CI"
  independent_validator_required: true
  primary_integrator_rerun_required: true

stop_conditions:
  - "accepted specification, evaluator, gate evidence or product-code change required"
  - "calendar or task status cannot be reconciled to protected evidence"

completion:
