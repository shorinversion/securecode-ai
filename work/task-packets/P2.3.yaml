  primary_integrator: "codex-root"
  owner_role: "cst-symbol-index-implementer"
  mode: "direct"
  parent_task_id: null
  exclusive_path_lease:
    - "CHANGELOG.md"
    - "docs/CONTEXT.md"
    - "docs/PLAN.md"
    - "packages/core/src/securecode_ai/core/__init__.py"
    - "packages/core/src/securecode_ai/core/symbols.py"
    - "packages/adapters/src/securecode_ai/adapters/__init__.py"
    - "packages/adapters/src/securecode_ai/adapters/cst.py"
    - "packages/adapters/pyproject.toml"
    - "tests/unit/test_cst_adapter.py"
    - "tests/unit/test_package_boundaries.py"
    - "uv.lock"
    - "work/task-attestations/P2.3.json"
    - "work/task-packets/P2.3.yaml"
  parallel_sibling_tasks: []
  may_delegate_further: false
  integration_owner: "codex-root"

scope:
  allowed_paths:
    - "CHANGELOG.md"
    - "docs/CONTEXT.md"
    - "docs/PLAN.md"
    - "packages/core/src/securecode_ai/core/__init__.py"
    - "packages/core/src/securecode_ai/core/symbols.py"
    - "packages/adapters/src/securecode_ai/adapters/__init__.py"
    - "packages/adapters/src/securecode_ai/adapters/cst.py"
    - "packages/adapters/pyproject.toml"
    - "tests/unit/test_cst_adapter.py"
    - "tests/unit/test_package_boundaries.py"
    - "uv.lock"
    - "work/task-attestations/P2.3.json"
    - "work/task-packets/P2.3.yaml"
  forbidden_paths:
    - "specs/**"
    - "scripts/**"
    - ".github/**"
    - "artifacts/gates/**"
    - "packages/contracts/**"
    - "apps/**"
    - "integrations/**"
    - "deploy/**"
  max_changed_files: 13
  max_diff_lines: 4000

capabilities:
  allowed_tools: [apply_patch, shell_command, independent_review]
  allowed_commands:
    - "git status/diff/show/rev-parse/add/commit"
    - "rg"
    - "uv lock --check and controlled lock refresh"
    - "pytest targeted CST adapter and package boundary suites"
    - "python scripts/quality.py"
    - "python scripts/spec_gate.py snapshot/index-candidate/committed-candidate"
    - "python scripts/ci_policy.py validate"
    - "python scripts/validate_g0.py --require-frozen"
  network: "deny except dependency resolution and authorized GitHub publication after completed local validation"
  "\x73\x65\x63\x72\x65\x74\x73": "deny"
  dependency_changes: "allow only exact locked tree-sitter runtime and Python grammar packages required by this adapter"

outputs:
  required_artifacts:
    - "framework-neutral immutable source locations, parse diagnostics, symbols and SymbolIndex values in Core"
    - "Python Tree-sitter adapter consuming exact caller-admitted bytes without filesystem access"
    - "module, class, function, async-function and method symbols with qualified names and exact byte/point ranges"
    - "deterministic content, symbol and index identities plus explicit bounded parse health"
    - "fixed non-echo typed adapter failures"

constraints:
  invariants:
    - "the adapter consumes repository, revision, normalized path, admitted content hash and source bytes; it never resolves or opens a path"
    - "the source content hash is recomputed before parsing and must equal the admitted hash"
    - "only Python is accepted and unsupported language input fails explicitly"
    - "invalid UTF-8, parser error or missing nodes, and every exhausted budget are explicit failures or diagnostics, never a silent clean parse"
    - "symbols and diagnostics are emitted in deterministic source order and exact repeated input produces byte-identical identities and index hash"
    - "semantic symbol identities remain stable when only preceding line offsets change; exact locations and the index hash still bind the current source bytes"
    - "all public values are immutable and validate closed enums, normalized paths, exact hashes, ranges, containment and budget counts"
  compatibility:
    - "new values are internal Core and adapters Python APIs, not public packages/contracts schema roots"
    - "accepted specifications and evaluator behavior remain unchanged"
  security:
    - "source text and parser exception messages are never echoed in validation failures"
    - "node, symbol, nesting, source-byte and diagnostic budgets are checked fail-closed"
    - "repository content has no instruction authority and cannot select a parser, grammar or capability"

budgets:
  max_iterations: 12
  max_tool_calls: 110
  timeout_seconds: 7200
  max_output_bytes: 400000

verification:
  acceptance_commands:
    - "targeted CST adapter and package boundary tests"
    - "canonical quality command"
    - "python scripts/spec_gate.py snapshot"
    - "python scripts/ci_policy.py validate"
    - "python scripts/validate_g0.py --require-frozen"
    - "git diff --check and exact packet scope validation"
  positive_cases:
    - "module, nested class, sync/async function and method fixtures produce exact deterministic qualified symbols"
    - "comments, decorators, multiline declarations and Unicode identifiers retain correct byte and point ranges"
    - "a harmless leading-line shift changes locations but preserves semantic symbol identities"
    - "empty valid Python produces a healthy zero-symbol index rather than an analysis failure"
  negative_cases:
    - "unsupported language, invalid normalized path, source hash mismatch and invalid UTF-8"
    - "malformed Python exposes bounded parse diagnostics and never reports a healthy parse"
    - "source-byte, node, symbol, nesting and diagnostic budget exhaustion"
    - "forged, copied, reordered, overlapping or out-of-bounds Core symbol/index values"
    - "repository source cannot trigger filesystem, import, execution, shell or network access"
  required_evidence:
    - "targeted positive/negative tests"
    - "full quality, lock, snapshot, CI policy and strict G0 PASS"
    - "independent product, architecture and security/evaluation PASS on one exact staged digest"
    - "post-commit clean verification and ordinary protected PR gate"
  independent_validator_required: true
  primary_integrator_rerun_required: true

stop_conditions:
  - "accepted specification or public contract change required"
  - "supporting another language or Python ast semantics is required"
  - "repository filesystem, source execution or network capability is required"
  - "protected evaluator or gate-evidence change required"
  - "no new diagnostic signal"

completion:
  definition_of_done_refs: [P2.3]
  partial_refs:
    SC-PROD-002: "Provides the Python CST adapter only; JavaScript/TypeScript and Go adapters remain beta tasks"
    SC-PROD-003: "Provides structural Python symbol parsing and explicit syntax health; semantic rules and Python ast analysis remain P2.4-P2.8"
    SC-PORT-004: "Consumes exact bounded admitted bytes without implementing the later RepositoryView service port"
  gate_contribution: "Supplies deterministic location-stable Python structural symbols toward G2; does not complete G2."
  changelog_required: true
  adr_required: false
