  preconditions:
    - "G1 is effective GO"
    - "P2.2 completion attestation is merged on the exact starting commit"
    - "the P2.2 protected PR and post-merge runs are green"
    - "snapshot spec gate and CI policy pass at starting_commit_sha"
  non_goals:
    - "Python ast semantic analysis, data-flow, call graph construction, rule evaluation, finding generation or EvidenceGraph integration"
    - "JavaScript, TypeScript or Go parsing; those remain P7.1-P7.2"
