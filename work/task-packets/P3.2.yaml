  primary_integrator: "codex-root"
  owner_role: "component-implementer"
  mode: "path_isolated_subtask"
  parent_task_id: null
  exclusive_path_lease:
    - "packages/core/src/securecode_ai/core/auditor.py"
    - "tests/unit/test_auditor_contract.py"
    - "work/task-packets/P3.2.yaml"
  parallel_sibling_tasks: [P3.1]
  may_delegate_further: false
  integration_owner: "codex-root"

scope:
  allowed_paths:
    - "packages/core/src/securecode_ai/core/auditor.py"
    - "tests/unit/test_auditor_contract.py"
    - "work/task-packets/P3.2.yaml"
  forbidden_paths: ["specs/**", "scripts/**", "artifacts/gates/**", "packages/contracts/**", "pyproject.toml", "uv.lock"]
  max_changed_files: 3
  max_diff_lines: 800

capabilities:
  allowed_tools: [apply_patch, shell_command]
  allowed_commands: ["git status/diff/show/add/commit", "rg"]
  network: "deny"
  "\x73\x65\x63\x72\x65\x74\x73": "deny"
  dependency_changes: "deny"

outputs:
  required_artifacts:
    - "closed structured auditor verdict parser with evidence citations"
    - "response object with independent model status and schema-valid result flag"
    - "fixed non-echoing failures for malformed output and citation violations"

constraints:
  invariants:
    - "only a SUCCEEDED call with valid structured output exposes a verdict"
    - "every verdict citation is unique and belongs to the selected EvidencePackage"
    - "non-success model outcomes cannot carry a schema-valid verdict"
  compatibility:
    - "uses existing ModelCallStatus and FindingVerdict enums without generic status aliases or public schema changes"
  security:
    - "Auditor remains a read-only typed consumer of evidence metadata; raw model output is never retained"

verification:
  acceptance_commands: ["deferred to primary integrator per assignment"]
  negative_cases: ["invented citation", "duplicate citation", "invalid payload", "success-status schema failure", "non-success with payload"]
  required_evidence: ["focused unit tests supplied for integrator execution"]
  independent_validator_required: true
  primary_integrator_rerun_required: true

stop_conditions:
  - "protected or public contract change required"
  - "raw model output retention or model transport required"
  - "new dependency required"

completion:
  definition_of_done_refs: [P3.2]
  changelog_required: false
  adr_required: false
