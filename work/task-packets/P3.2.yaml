  spec_refs: [SC-DOM-001, SC-DOM-002, SC-DOM-005, SC-DOM-010, SC-DOM-013, SC-WF-006, SC-CAP-002, SC-CAP-009]
  decision_refs: [D-015, D-027]
  preconditions:
