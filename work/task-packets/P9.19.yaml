  - existing academic and benchmark evidence
  - publication README and deployment examples
  context_budget_tokens: 24000
outputs:
  required_artifacts:
  - private GitHub branch
  - protected pull request
  - detailed bilingual README
  - clean repository tree
  - exact validation results
  - three independent final reviews
  structured_result_schema: securecode.publication-candidate.v1
constraints:
  invariants:
  - private source stays private
  - secrets and raw proprietary source never enter durable artifacts
  - indeterminate coverage never becomes PASS
  - G9 and final v1.0 remain open until their own evidence is effective
  compatibility:
  - CLI, server, worker and CI examples match implemented interfaces
  - workspace remains installable from the locked dependency graph
  security:
  - no credentials or private environment values
  - untrusted fixtures execute only under their existing isolated controls
  - protected policy and test bytes remain CR-090 and CR-091 exact
  privacy:
  - GitHub repository remains private
  - no public-license grant is inferred
  performance:
  - canonical quality uses the bounded CR-090 timeouts
verification:
  acceptance_commands:
  - uv lock --check
  - uv run securecode --version
  - python scripts/spec_gate.py index-candidate
  - python scripts/precommit_entry.py policy
  - python scripts/precommit_entry.py secrets
  - python scripts/quality.py
  - local Markdown link audit
  - three independent final reviews
  - GitHub protected PR checks
  positive_cases:
  - locked workspace installs consistently
  - CLI reports 1.0.0rc1
  - README commands match help
  - private branch and PR contain only intended tracked files
  negative_cases:
  - mixed legacy and rc1 workspace
  - secret candidate
  - stale or incomplete publication state
  - unsupported G9 or final-release claim
  required_evidence:
  - SpecGate result
  - canonical quality result
  - secret and policy checks
  - review findings
  - pull request URL and checks
  independent_validator_required: true
  primary_integrator_rerun_required: true
stop_conditions:
- secret exposure
- protected policy drift
- unresolved canonical quality failure
- blocking independent review finding
- GitHub publication would become public
completion:
  definition_of_done_refs:
  - P9.16
  - P9.19
  gate_contribution: Publishes a private 1.0.0rc1 candidate for review; it does not establish G9, a public license, final v1.0 or PROJECT CLOSED.
  changelog_required: true
  adr_required: false
