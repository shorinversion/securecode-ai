    - "packages/adapters/src/securecode_ai/adapters/endpoint.py"
    - "packages/adapters/src/securecode_ai/adapters/__init__.py"
    - "packages/adapters/README.md"
    - "tests/unit/test_model_contracts.py"
    - "tests/unit/test_model_schemas.py"
    - "tests/unit/test_domain_schemas.py"
    - "tests/unit/test_provider_preflight.py"
    - "tests/unit/test_provider_normalization.py"
