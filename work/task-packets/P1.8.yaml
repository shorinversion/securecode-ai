schema_version: "0.1-draft"

task:
  id: "P1.8"
  type: "implementation"
  objective: "Implement a provider-agnostic model port, hermetic fake provider, dialect-specific response normalization, joint provider/egress preflight and connect-time endpoint authorization without live SDK or workflow-runtime coupling."
  baseline_id: "securecode-definition-0.2.0"
  baseline_content_sha256: "dedb43be8ba055dfa47858b975630b4c870af3bed2dda842b0e8422c8354b5c9"
  baseline_commit_sha: "f5cd4ef2a0f7130d16cb2c206091908be71b0702"
  starting_commit_sha: "700c71919a65705e2786d7da2b570ee176953fba"
  spec_refs: [SC-DOM-001, SC-DOM-002, SC-DOM-014, SC-PORT-001, SC-PORT-002, SC-PORT-003, SC-PORT-004, SC-MODEL-001, SC-MODEL-002, SC-MODEL-003, SC-MODEL-004, SC-MODEL-005, SC-MODEL-006, SC-MODEL-007, SC-ENDPOINT-001, SC-ENDPOINT-002, SC-ENDPOINT-003, SC-ENDPOINT-004, SC-ENDPOINT-005, SC-ENDPOINT-006, SC-EGRESS-001, SC-EGRESS-002, SC-EGRESS-003, SC-EGRESS-004, SC-EGRESS-005, SC-EGRESS-007, SC-EGRESS-008, SC-EVAL-003, SC-EVAL-013]
  decision_refs: [D-002, D-015, D-024, D-026, D-027]
  preconditions:
    - "G0 strict validator exits 0 against frozen baseline 0.2.0"
    - "P1.5 versioned contracts and P1.7 immutable provider registry/credential lease are committed"
  non_goals:
    - "live OpenAI, Anthropic or OpenAI-compatible HTTP clients and external provider SDK dependencies"
    - "prompt/context assembly, RepositoryView operation execution or model-native discovery workflow owned by P3; P1.8 only carries and validates the immutable scope/policy pins"
    - "WorkflowRuntime transitions, retries and durable orchestration owned by P1.9/P3"
    - "SC-WF-017 AuditRunOutcome derivation and mandatory-node routing are owned by P3.5; P1.8 exposes typed non-success inputs and cannot emit a clean verdict"
    - "general structured logging, persistence and telemetry sinks owned by P1.12 and later phases"
    - "production secret-manager clients and credential rotation owned by P8.5"
    - "LLM output becoming a finding verdict, policy decision or clean PASS"

