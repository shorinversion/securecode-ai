<style>
:root { color-scheme: light; --ink: #1d2023; --muted: #626c77; --red: #ff0032; --pale: #f4f4f4; --rule: #e4e4e4; }
html { background: var(--pale); }
body { max-width: 1120px; margin: 32px auto; padding: 44px 56px; background: #fff; color: var(--ink); font: 16px/1.6 MTSSans, "MTS Sans", Arial, Roboto, "Segoe UI", sans-serif; border-radius: 32px; }
h1, h2, h3 { color: var(--ink); line-height: 1.1; font-weight: 400; }
h1 { font-size: 2.6rem; text-transform: uppercase; letter-spacing: -.02em; }
h2 { margin-top: 2em; font-size: 1.6rem; text-transform: uppercase; letter-spacing: -.01em; }
h3 { margin-top: 1.5em; font-size: 1.15rem; font-weight: 600; }
header { border-bottom: 0; }
p, li { max-width: 100ch; }
table { width: 100%; border-collapse: collapse; margin: 1.2em 0 1.8em; font-size: .9rem; }
th { color: var(--muted); font-weight: 500; text-align: left; border-bottom: 2px solid var(--ink); }
th, td { border-bottom: 1px solid var(--rule); padding: .6em .65em; vertical-align: top; }
code { background: var(--pale); border-radius: 6px; padding: .1em .3em; overflow-wrap: anywhere; }
pre { background: var(--ink); color: #f4f4f4; padding: 1.1em 1.3em; overflow-x: auto; border-radius: 20px; }
pre code { background: none; color: inherit; }
a { color: var(--ink); text-decoration-color: var(--red); text-underline-offset: 3px; }
hr { border: 0; border-top: 1px solid var(--rule); margin: 3em 0; }
@media print { html { background: #fff; } body { max-width: none; margin: 0; padding: 12mm; border-radius: 0; font-size: 10pt; } h1, h2, h3 { break-after: avoid; } table, tr { break-inside: avoid; } a { color: inherit; text-decoration: none; } }
@media (max-width: 800px) { body { margin: 0; padding: 22px; border-radius: 0; } table { display: block; overflow-x: auto; } }
</style>
