<style>
:root { color-scheme: light; --ink: #172033; --muted: #526079; --blue: #2355a6; --pale: #eef3fa; --rule: #d7dfea; }
html { background: #f3f5f8; }
body { max-width: 1120px; margin: 32px auto; padding: 42px 54px; background: #fff; color: var(--ink); font: 16px/1.6 "Segoe UI", Arial, sans-serif; box-shadow: 0 8px 32px #17203318; }
h1, h2, h3 { color: var(--blue); line-height: 1.25; }
h1 { font-size: 2rem; border-bottom: 2px solid var(--rule); padding-bottom: .45em; }
h2 { margin-top: 2em; font-size: 1.4rem; }
h3 { margin-top: 1.5em; font-size: 1.1rem; }
p, li { max-width: 100ch; }
table { width: 100%; border-collapse: collapse; margin: 1.2em 0 1.8em; font-size: .9rem; }
th { background: var(--blue); color: #fff; text-align: left; }
th, td { border: 1px solid var(--rule); padding: .55em .65em; vertical-align: top; }
tr:nth-child(even) td { background: var(--pale); }
code { background: #f0f3f7; border-radius: 3px; padding: .1em .28em; overflow-wrap: anywhere; }
pre { background: #f0f3f7; padding: 1em; overflow-x: auto; border-left: 3px solid var(--blue); }
a { color: #174b9a; }
hr { border: 0; border-top: 1px solid var(--rule); margin: 3em 0; }
@media print { html { background: #fff; } body { max-width: none; margin: 0; padding: 12mm; box-shadow: none; font-size: 10pt; } h1, h2, h3 { break-after: avoid; } table, tr { break-inside: avoid; } a { color: inherit; text-decoration: none; } }
@media (max-width: 800px) { body { margin: 0; padding: 22px; } table { display: block; overflow-x: auto; } }
</style>
